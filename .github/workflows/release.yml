name: Release
# Pushing a version tag (v1.10 for version.properties 1.10) builds an unsigned release APK on GitHub's
# runners. Then exactly one of two paths runs, chosen by the repository variable METEOR_CI_SIGNING:
#   true         the 'release' environment's key signs the APK here and a DRAFT release is created
#   anything else  the unsigned build is attested and left as a run artifact for signing offline
# Nothing is ever published automatically, and an unsigned APK is never attached to a release.
# Details: docs/RELEASING.md
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch: # rehearsal: builds and checks the unsigned APK from the chosen ref, releases nothing
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    uses: ./.github/workflows/validate.yml
    permissions:
      contents: read
  build:
    name: Build unsigned release APK
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # the tag check needs main's history
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Tag matches version.properties and sits on main
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          python scripts/release_apk.py check-tag "$TAG"
          git merge-base --is-ancestor "$COMMIT" origin/main \
            || { echo "::error::Release tags must point at a commit on main"; exit 1; }
      - name: Install Android SDK platform
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36.1" >/dev/null'
      - name: Build the unsigned release APK
        working-directory: android-app
        run: ./gradlew :app:assembleRelease --console=plain
      - name: Check and collect the unsigned APK
        env:
          COMMIT: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          built=(android-app/app/build/outputs/apk/release/*.apk)
          [ "${#built[@]}" -eq 1 ] || { echo "::error::Expected exactly one release APK, found ${#built[@]}"; exit 1; }
          version=$(python scripts/version.py show | python -c 'import json,sys; print(json.load(sys.stdin)["versionName"])')
          mkdir dist
          cp "${built[0]}" "dist/Meteor-${version}-unsigned.apk"
          python scripts/release_apk.py verify --unsigned "dist/Meteor-${version}-unsigned.apk"
          python scripts/release_apk.py inspect "dist/Meteor-${version}-unsigned.apk" \
            --commit "$COMMIT" --run-url "$RUN_URL" --out dist/build-info.json > /dev/null
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: meteor-unsigned
          path: dist/
          if-no-files-found: error
          retention-days: 30

  sign-and-draft:
    name: Sign in CI and draft the release
    needs: build
    if: github.ref_type == 'tag' && vars.METEOR_CI_SIGNING == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Holds the signing secrets. Give it required reviewers and a tag rule (v*) in the repository settings.
    environment: release
    permissions:
      contents: write # create the draft release
      id-token: write # lets the attestation be signed by GitHub's OIDC identity for this run
      attestations: write # stores the attestation with the repository
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: meteor-unsigned
          path: unsigned
      - name: Sign, verify and package
        id: assemble
        env:
          METEOR_KEYSTORE_B64: ${{ secrets.METEOR_KEYSTORE_B64 }}
          METEOR_KEYSTORE_PASSWORD: ${{ secrets.METEOR_KEYSTORE_PASSWORD }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          for name in METEOR_KEYSTORE_B64 METEOR_KEYSTORE_PASSWORD; do
            [ -n "${!name}" ] || { echo "::error::Secret $name is not set in the 'release' environment"; exit 1; }
          done
          unsigned=(unsigned/*-unsigned.apk)
          [ "${#unsigned[@]}" -eq 1 ] || { echo "::error::Expected exactly one unsigned APK"; exit 1; }
          umask 077
          keystore="$RUNNER_TEMP/meteor-release.p12"
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$METEOR_KEYSTORE_B64" | base64 -d > "$keystore"
          python scripts/release_apk.py assemble \
            --unsigned "${unsigned[0]}" --build-info unsigned/build-info.json \
            --keystore "$keystore" --alias meteor-release --ks-pass env:METEOR_KEYSTORE_PASSWORD \
            --out-dir dist --repo "$REPO"
      - name: Attest the signed APK
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.apk
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.assemble.outputs.version }}
        run: |
          gh release create "$TAG" "dist/Meteor-${VERSION}.apk" dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --draft --prerelease --verify-tag \
            --title "Meteor ${VERSION}" --notes-file dist/RELEASE-NOTES.md
      - name: Summary
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.assemble.outputs.version }}
          SIGNER: ${{ steps.assemble.outputs.signer }}
        run: |
          {
            echo "### Draft pre-release ${TAG} created"
            echo
            echo "Signed \`Meteor-${VERSION}.apk\` with certificate SHA-256 \`${SIGNER}\` (matches \`release-signer.sha256\`)."
            echo "Review the draft under Releases, then publish it. See docs/RELEASING.md."
          } >> "$GITHUB_STEP_SUMMARY"

  offline-signing:
    name: Unsigned build ready for offline signing
    needs: build
    if: github.ref_type == 'tag' && vars.METEOR_CI_SIGNING != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # lets the attestation be signed by GitHub's OIDC identity for this run
      attestations: write # stores the attestation with the repository
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: meteor-unsigned
          path: unsigned
      - name: Attest the unsigned build
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: unsigned/*-unsigned.apk
      - name: Summary
        env:
          TAG: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          {
            echo "### Unsigned build for ${TAG} is ready: nothing was released"
            echo
            echo "CI signing is off (repository variable METEOR_CI_SIGNING is not \`true\`). Sign the artifact \`meteor-unsigned\` on a trusted computer:"
            echo
            echo '```sh'
            echo "gh run download ${RUN_ID} --name meteor-unsigned --dir unsigned"
            echo "gh attestation verify unsigned/Meteor-*-unsigned.apk --repo ${GITHUB_REPOSITORY}"
            echo 'python scripts/release_apk.py assemble --unsigned unsigned/Meteor-*-unsigned.apk --build-info unsigned/build-info.json \'
            echo '  --keystore PATH/TO/meteor-release.p12 --alias meteor-release --ks-pass env:METEOR_KEYSTORE_PASSWORD --out-dir dist'
            echo '```'
            echo
            echo "Then draft the release from \`dist/\`. See docs/RELEASING.md."
          } >> "$GITHUB_STEP_SUMMARY"
